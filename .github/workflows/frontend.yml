name: "Frontend CI"
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      
      - name: "Install Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "22.15.0"
          cache: "pnpm"
      
      - name: Install dependencies
        run: pnpm install

      - name: test
        run: pnpm test